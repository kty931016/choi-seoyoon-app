<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff5f5">
  <meta name="description" content="최서윤의 성장과 일상을 위한 육아 앱">
  <title>최서윤</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --pink: #f5b8c8;
      --pink-light: #fff0f4;
      --cream: #fffaf6;
      --ink: #493d40;
      --muted: #887b80;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
    }

    button { font: inherit; cursor: pointer; }

    .app {
      max-width: 680px;
      min-height: 100vh;
      margin: auto;
      padding: 22px 18px 100px;
    }

    header { text-align: center; }

    .logo {
      width: 94px;
      height: 94px;
      border-radius: 28px;
      object-fit: cover;
      background: var(--pink-light);
      margin: 8px auto;
    }

    h1 { font-size: 27px; margin: 6px 0; }
    .subtitle { color: var(--muted); font-size: 14px; }

    .hero {
      margin-top: 24px;
      padding: 23px;
      border-radius: 25px;
      background: linear-gradient(135deg, #ffe6ed, #fff5e9);
    }

    .hero h2 { margin: 0 0 8px; font-size: 23px; }
    .hero p { line-height: 1.7; margin: 6px 0; }

    .section-title { font-size: 19px; margin: 26px 0 12px; }

    .card {
      background: var(--white);
      border: 1px solid #f3e8e8;
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 12px;
      line-height: 1.65;
    }

    .card h3 { margin: 0 0 8px; font-size: 17px; }
    .muted { color: var(--muted); font-size: 13px; }
    .tag {
      display: inline-block;
      background: var(--pink-light);
      border-radius: 20px;
      padding: 4px 10px;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .tabs {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-around;
      padding: 10px 4px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.97);
      border-top: 1px solid #f1e5e8;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 7px 3px;
      border-radius: 12px;
      font-size: 12px;
      min-width: 55px;
    }

    .tab .emoji { display: block; font-size: 21px; margin-bottom: 3px; }
    .tab.active { background: var(--pink-light); color: #a74765; font-weight: 700; }

    .item-button {
      border: 0;
      width: 100%;
      text-align: left;
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .notice { font-size: 13px; color: var(--muted); line-height: 1.6; }
    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      border: 1px solid #eadde0;
      border-radius: 12px;
      background: white;
    }

    .primary {
      border: 0;
      border-radius: 12px;
      background: var(--pink);
      color: #493039;
      padding: 12px 18px;
      font-weight: 700;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="./seoyoon-logo.png" alt="서윤이 로고"
      onerror="this.style.display='none'">
    <h1>최서윤 🌷</h1>
    <div class="subtitle">서윤이와 함께 자라는 하루</div>
  </header>

  <main id="content" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="주 메뉴">
  <button class="tab active" data-tab="today"><span class="emoji">☀️</span>오늘</button>
  <button class="tab" data-tab="season"><span class="emoji">🌿</span>계절</button>
  <button class="tab" data-tab="development"><span class="emoji">🌱</span>발달</button>
  <button class="tab" data-tab="play"><span class="emoji">🧸</span>놀이</button>
  <button class="tab" data-tab="baby"><span class="emoji">👶</span>우리 아기</button>
</nav>

<script>
const BABY_BIRTHDAY = "2026-01-13";
const content = document.getElementById("content");
let currentTab = "today";
let developmentData = [];
let playData = [];

function getAge() {
  const birth = new Date(BABY_BIRTHDAY + "T00:00:00");
  const now = new Date();
  let months = (now.getFullYear() - birth.getFullYear()) * 12
    + now.getMonth() - birth.getMonth();

  if (now.getDate() < birth.getDate()) months--;
  const monthDate = new Date(birth);
  monthDate.setMonth(monthDate.getMonth() + months);
  const days = Math.max(0, Math.floor((now - monthDate) / 86400000));
  const totalDays = Math.max(0, Math.floor((now - birth) / 86400000));

  return { months: Math.max(0, months), days, totalDays };
}

function card(title, body, tag = "") {
  return `<article class="card">
    ${tag ? `<span class="tag">${tag}</span>` : ""}
    <h3>${title}</h3>${body}
  </article>`;
}

function render() {
  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === currentTab);
  });

  const age = getAge();
  let html = "";

  if (currentTab === "today") {
    html = `
      <section class="hero">
        <h2>오늘의 서윤이 💗</h2>
        <p>태어난 지 ${age.totalDays}일</p>
        <p>${age.months}개월 ${age.days}일</p>
        <p class="muted">오늘도 서윤이만의 속도로 자라고 있어요.</p>
      </section>
      <h2 class="section-title">오늘의 육아</h2>
      ${card("오늘의 날씨", "날씨 정보 기능을 연결할 예정이에요.", "날씨")}
      ${card("오늘의 기록", "서윤이의 수면, 식사, 기분을 기록하는 기능을 준비 중이에요.", "기록")}
    `;
  }

  if (currentTab === "season") {
    html = `<h2 class="section-title">계절과 외출 🌿</h2>
      ${card("날씨에 맞는 옷차림", "현재 위치의 날씨를 연결한 뒤 기온에 맞는 옷차림을 안내할게요.")}
      ${card("계절별 육아 팁", "외출 준비물과 계절별 주의사항을 별도 데이터로 관리할 예정이에요.")}`;
  }

  if (currentTab === "development") {
    const monthItems = developmentData.filter(item =>
      item.month === age.months
    );
    html = `<h2 class="section-title">월령별 발달 🌱</h2>
      <p class="notice">현재 월령: ${age.months}개월 · 발달 속도에는 개인차가 있어요.</p>`;
    html += monthItems.length
      ? monthItems.map(item => card(
          item.title || "발달 정보",
          `<p>${item.description || ""}</p><p class="muted">${item.source || ""}</p>`,
          item.category || ""
        )).join("")
      : card("발달 자료 준비 중", "신뢰할 수 있는 자료를 출처와 함께 연결할 예정이에요.");
  }

  if (currentTab === "play") {
    const monthItems = playData.filter(item =>
      !item.month || item.month === age.months
    );
    html = `<h2 class="section-title">서윤이랑 놀아요 🧸</h2>`;
    html += monthItems.length
      ? monthItems.map(item => card(
          item.title || "놀이",
          `<p>${item.description || ""}</p>
           <p><b>준비물:</b> ${item.materials || "자료 확인 중"}</p>
           <p><b>놀이 방법:</b> ${item.steps || "자료 확인 중"}</p>
           <p class="muted">${item.source || ""}</p>`,
          item.category || "놀이"
        )).join("")
      : card("놀이 자료 준비 중", "월령에 맞는 놀이 방법과 안전 수칙을 연결할 예정이에요.");
  }

  if (currentTab === "baby") {
    html = `<h2 class="section-title">우리 아기 👶</h2>
      ${card("서윤이 프로필", `생년월일: 2026년 1월 13일<br>
        현재 월령: ${age.months}개월 ${age.days}일<br>
        총 ${age.totalDays}일째 함께하는 중이에요.`)}
      ${card("성장 기록", "키와 몸무게를 기록하는 기능은 다음 단계에서 추가할게요.")}`;
  }

  content.innerHTML = html;
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    currentTab = button.dataset.tab;
    render();
  });
});

async function loadData() {
  try {
    const response = await fetch("./development.json");
    if (response.ok) developmentData = await response.json();
  } catch (error) {
    console.info("발달 데이터 파일은 다음 단계에서 연결합니다.");
  }

  try {
    const response = await fetch("./play.json");
    if (response.ok) playData = await response.json();
  } catch (error) {
    console.info("놀이 데이터 파일은 다음 단계에서 연결합니다.");
  }

  render();
}

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(error => {
      console.info("서비스 워커는 설정 단계에서 연결합니다.", error);
    });
  });
}

render();
loadData();
</script>
</body>
</html>

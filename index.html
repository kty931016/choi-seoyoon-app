
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff8f5">
  <meta name="description" content="최서윤의 성장과 일상을 위한 육아 앱">
  <link rel="manifest" href="./manifest.json">
  <title>최서윤 🌷</title>

  <style>
    :root {
      --bg: #fffaf7;
      --card: #ffffff;
      --accent: #e89b91;
      --accent-light: #fff0ec;
      --ink: #493b39;
      --muted: #8e817e;
      --line: #f0e3df;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR",
        "Malgun Gothic", sans-serif;
      line-height: 1.65;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .app {
      max-width: 620px;
      min-height: 100vh;
      margin: auto;
      padding: 20px 16px 100px;
    }

    header {
      text-align: center;
      padding: 10px 0 20px;
    }

    .logo {
      width: 94px;
      height: 94px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;
      box-shadow: 0 3px 15px #d8b7ad55;
    }

    header h1 {
      margin: 8px 0 0;
      font-size: 25px;
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 2px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      color: var(--muted);
      font-size: 12px;
    }

    .tab.active {
      background: var(--accent-light);
      color: #a95f56;
      border-color: var(--accent);
      font-weight: 700;
    }

    .hero {
      background: linear-gradient(135deg, #fff0ec, #fff9e9);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .hero h2 {
      margin: 4px 0 8px;
      font-size: 22px;
    }

    .hero p {
      margin: 0;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      color: #a95f56;
      background: white;
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 17px;
      padding: 16px;
      margin-bottom: 12px;
      overflow-wrap: anywhere;
    }

    .card h3 {
      margin: 0 0 8px;
      font-size: 17px;
    }

    .card p {
      margin: 7px 0;
      font-size: 14px;
    }

    .muted {
      color: var(--muted);
      font-size: 12px !important;
    }

    .section-title {
      font-size: 18px;
      margin: 22px 0 10px;
    }

    .source {
      display: inline-block;
      color: #a95f56;
      font-size: 12px;
      margin-top: 8px;
      text-decoration: underline;
    }

    .notice {
      background: #fff4e7;
      border-radius: 12px;
      padding: 12px;
      color: #78634d;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .empty {
      text-align: center;
      padding: 30px 12px;
      color: var(--muted);
      background: white;
      border-radius: 16px;
    }

    .profile-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      font-size: 14px;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffffef;
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      text-align: center;
      color: var(--muted);
      font-size: 11px;
    }

    .loading {
      text-align: center;
      padding: 25px 10px;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <img class="logo" src="./seoyoon-logo.png" alt="서윤이 얼굴">
      <h1>최서윤 🌷</h1>
      <div class="sub">서윤이의 성장과 일상을 기록해요</div>
    </header>

    <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
    <main id="main">
      <div class="loading">서윤이 정보를 불러오는 중이에요 🌷</div>
    </main>
  </div>

  <footer>우리 아기의 속도에 맞춰 천천히 함께해요 💗</footer>

  <script>
    const BABY_NAME = "서윤";
    const BIRTH_DATE = "2026-01-13";

    let currentPage = "home";
    let developmentData = [];
    let playData = [];

    const pageNames = {
      home: "오늘",
      season: "계절",
      dev: "발달",
      play: "놀이",
      profile: "우리 아기"
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function getAge() {
      const birth = new Date(BIRTH_DATE + "T00:00:00");
      const today = new Date();

      let months =
        (today.getFullYear() - birth.getFullYear()) * 12 +
        today.getMonth() - birth.getMonth();

      if (today.getDate() < birth.getDate()) {
        months--;
      }

      return Math.max(0, months);
    }

    /*
      핵심 수정:
      JSON의 제목이 '한 달 · ...', '열두 달 · ...'처럼
      한글 숫자로 되어 있어도 month 값을 사용해
      '1개월 · ...', '12개월 · ...'로 표시합니다.
    */
    function formatMonthTitle(item) {
      const title = String(item.title || "발달 정보");
      const month = Number(item.month);

      if (!Number.isFinite(month)) {
        return escapeHTML(title);
      }

      if (month === 0) {
        return escapeHTML(title);
      }

      const separator = title.indexOf("·");
      const rest = separator >= 0
        ? title.slice(separator + 1).trim()
        : title;

      return `${month}개월 · ${escapeHTML(rest)}`;
    }

    function renderTabs() {
      document.getElementById("tabs").innerHTML =
        Object.entries(pageNames).map(([id, name]) => `
          <button
            class="tab ${currentPage === id ? "active" : ""}"
            data-page="${id}"
            aria-current="${currentPage === id ? "page" : "false"}"
          >${name}</button>
        `).join("");
    }

    function renderHome() {
      const age = getAge();

      document.getElementById("main").innerHTML = `
        <section class="hero">
          <span class="badge">오늘의 서윤이</span>
          <h2>서윤이는 ${age}개월이에요 👶</h2>
          <p>오늘도 서윤이의 성장과 작은 변화를 함께 살펴봐요.</p>
        </section>

        <h2 class="section-title">🌱 지금 시기 발달</h2>
        <div id="homeDevelopment"></div>

        <h2 class="section-title">🎈 오늘의 놀이</h2>
        <div id="homePlay"></div>

        <div class="notice">
          발달 정보는 아이마다 다른 성장 속도를 이해하기 위한 참고 자료예요.
          한 가지 행동만으로 발달 지연 여부를 판단하지 마세요.
        </div>
      `;

      const dev = developmentData.find(
        item => Number(item.month) === age
      );

      const play = playData.find(
        item => Number(item.month) === age
      );

      document.getElementById("homeDevelopment").innerHTML = dev
        ? renderDevelopmentCard(dev)
        : `<div class="empty">해당 월령의 발달 정보를 준비하고 있어요.</div>`;

      document.getElementById("homePlay").innerHTML = play
        ? renderPlayCard(play)
        : `<div class="empty">해당 월령의 놀이 정보가 아직 없어요.</div>`;
    }

    function renderDevelopmentCard(item) {
      const sourceLink = item.sourceUrl
        ? `<a class="source" href="${escapeHTML(item.sourceUrl)}"
             target="_blank" rel="noopener noreferrer">
             출처 확인하기 ↗
           </a>`
        : "";

      return `
        <article class="card">
          <h3>${formatMonthTitle(item)}</h3>
          <p>${escapeHTML(item.description || "")}</p>
          ${item.source
            ? `<p class="muted">출처: ${escapeHTML(item.source)}</p>`
            : ""}
          ${sourceLink}
        </article>
      `;
    }

    function renderPlayCard(item) {
      const sourceLink = item.sourceUrl
        ? `<a class="source" href="${escapeHTML(item.sourceUrl)}"
             target="_blank" rel="noopener noreferrer">
             출처 확인하기 ↗
           </a>`
        : "";

      return `
        <article class="card">
          <h3>${escapeHTML(item.title || "오늘의 놀이")}</h3>
          <p>${escapeHTML(item.description || item.content || "")}</p>
          ${sourceLink}
        </article>
      `;
    }

    function renderDevelopmentPage() {
      const age = getAge();
      const item = developmentData.find(
        entry => Number(entry.month) === age
      );

      document.getElementById("main").innerHTML = `
        <section class="hero">
          <span class="badge">월령별 발달</span>
          <h2>${age}개월 발달 살펴보기 👶</h2>
          <p>서윤이의 현재 월령에 해당하는 내용을 확인해요.</p>
        </section>

        <div class="notice">
          발달 항목은 참고용 관찰 가이드예요.
          모든 아이가 같은 시기에 같은 행동을 보이는 것은 아니에요.
        </div>

        ${item
          ? renderDevelopmentCard(item)
          : `<div class="empty">이 월령의 발달 정보를 찾을 수 없어요.</div>`}
      `;
    }

    function renderPlayPage() {
      const age = getAge();
      const item = playData.find(
        entry => Number(entry.month) === age
      );

      document.getElementById("main").innerHTML = `
        <section class="hero">
          <span class="badge">월령별 놀이</span>
          <h2>${age}개월 놀이 🎈</h2>
          <p>놀이를 통해 서윤이와 즐겁게 상호작용해요.</p>
        </section>

        ${item
          ? renderPlayCard(item)
          : `<div class="empty">
              놀이 정보가 아직 준비되지 않았어요.<br>
              play.json 파일을 추가하면 이곳에 표시돼요.
            </div>`}
      `;
    }

    function renderSeasonPage() {
      const age = getAge();

      document.getElementById("main").innerHTML = `
        <section class="hero">
          <span class="badge">계절과 일상</span>
          <h2>계절을 함께 느껴봐요 🍂</h2>
          <p>현재 ${age}개월인 서윤이와 무리하지 않고 주변을 탐색해요.</p>
        </section>

        <article class="card">
          <h3>🌳 주변 관찰하기</h3>
          <p>창밖의 나무, 바람 소리, 햇빛처럼 주변의 변화를 함께 살펴봐요.</p>
        </article>

        <article class="card">
          <h3>🧸 실내에서 놀기</h3>
          <p>날씨가 좋지 않거나 외출이 어려운 날에는 그림책과 안전한 장난감으로 놀아주세요.</p>
        </article>

        <div class="notice">
          외출할 때는 기온과 바람, 미세먼지 등 당일 환경을 확인하고
          아기의 컨디션에 맞춰 활동해 주세요.
        </div>
      `;
    }

    function renderProfilePage() {
      const age = getAge();

      document.getElementById("main").innerHTML = `
        <section class="hero">
          <span class="badge">우리 아기</span>
          <h2>최서윤 💗</h2>
          <p>서윤이의 기본 정보를 확인해요.</p>
        </section>

        <article class="card">
          <div class="profile-row">
            <strong>이름</strong><span>최서윤</span>
          </div>
          <div class="profile-row">
            <strong>생년월일</strong><span>2026년 1월 13일</span>
          </div>
          <div class="profile-row">
            <strong>현재 월령</strong><span>${age}개월</span>
          </div>
        </article>

        <div class="notice">
          월령은 생년월일을 기준으로 자동 계산돼요.
        </div>
      `;
    }

    function render() {
      renderTabs();

      if (currentPage === "home") renderHome();
      if (currentPage === "season") renderSeasonPage();
      if (currentPage === "dev") renderDevelopmentPage();
      if (currentPage === "play") renderPlayPage();
      if (currentPage === "profile") renderProfilePage();
    }

    async function loadData() {
      const results = await Promise.allSettled([
        fetch("./development.json").then(response => {
          if (!response.ok) throw new Error("development.json");
          return response.json();
        }),
        fetch("./play.json").then(response => {
          if (!response.ok) throw new Error("play.json");
          return response.json();
        })
      ]);

      if (results[0].status === "fulfilled" &&
          Array.isArray(results[0].value)) {
        developmentData = results[0].value;
      }

      if (results[1].status === "fulfilled" &&
          Array.isArray(results[1].value)) {
        playData = results[1].value;
      }

      render();
    }

    document.getElementById("tabs").addEventListener("click", event => {
      const button = event.target.closest("[data-page]");
      if (!button) return;

      currentPage = button.dataset.page;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    render();
    loadData();

    if ("serviceWorker" in navigator &&
        location.protocol === "https:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .catch(error => console.error("서비스 워커 등록 실패:", error));
      });
    }
  </script>
</body>
</html>

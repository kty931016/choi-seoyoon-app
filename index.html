
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7f2">
  <meta name="description" content="서윤이의 성장과 일상을 기록하는 육아 앱">
  <title>서윤이의 하루</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./seoyoon-logo.png">
  <style>
    :root {
      --bg: #fffaf7;
      --card: #ffffff;
      --pink: #f5b8c8;
      --pink-dark: #c96986;
      --peach: #fff0e7;
      --text: #493c3b;
      --muted: #8b7d7a;
      --line: #f1e4df;
      --green: #e9f4e9;
      --shadow: 0 5px 18px rgba(105, 65, 65, .06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 650px; margin: 0 auto; padding-bottom: 95px; }
    header {
      padding: 22px 18px 12px;
      display: flex;
      align-items: center;
      gap: 13px;
    }
    .logo {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 50%;
      background: white;
      border: 2px solid #f8dbe3;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.35; }
    .subtitle { color: var(--muted); font-size: 12px; margin-top: 3px; }
    main { padding: 8px 16px 20px; }
    .tabs {
      display: flex;
      gap: 7px;
      padding: 0 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      border: 1px solid var(--line);
      background: white;
      color: var(--muted);
      border-radius: 22px;
      padding: 9px 13px;
      white-space: nowrap;
      font-size: 13px;
    }
    .tab.active {
      background: var(--pink);
      border-color: var(--pink);
      color: #633c49;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 13px;
      box-shadow: var(--shadow);
    }
    .hero {
      background: linear-gradient(135deg, #fff0f3, #fff4e9);
      border: none;
      padding: 22px 19px;
    }
    .hero h2 { font-size: 22px; margin: 0 0 5px; }
    h2 { font-size: 19px; margin: 0 0 12px; }
    h3 { font-size: 16px; margin: 0 0 7px; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 13px; }
    .small { font-size: 12px; }
    .pill {
      display: inline-block;
      background: var(--peach);
      color: #8e5c4e;
      border-radius: 30px;
      padding: 4px 10px;
      font-size: 12px;
      margin: 0 4px 5px 0;
    }
    .notice {
      background: #fff8e9;
      border-radius: 13px;
      padding: 12px;
      font-size: 13px;
      margin-top: 10px;
    }
    .green-note { background: var(--green); }
    .row { display: flex; gap: 10px; }
    .row > * { flex: 1; min-width: 0; }
    .stat {
      background: #fff8f7;
      border-radius: 13px;
      padding: 12px;
      text-align: center;
    }
    .stat strong { display: block; font-size: 19px; }
    .section-title { margin: 20px 2px 10px; font-size: 17px; }
    .item {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .item:last-child { border-bottom: 0; }
    .item-title { font-weight: 700; }
    .item p { white-space: pre-line; }
    .btn {
      border: 0;
      background: var(--pink);
      color: #633c49;
      font-weight: 700;
      border-radius: 13px;
      padding: 11px 14px;
      width: 100%;
      margin-top: 10px;
    }
    .btn.secondary {
      background: #fff0e7;
      color: #805b50;
    }
    .field { margin: 12px 0; }
    .field label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .field input, .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      padding: 11px;
      color: var(--text);
    }
    .empty { text-align: center; padding: 25px 10px; color: var(--muted); }
    .loading { color: var(--muted); font-size: 13px; }
    .source-link { color: var(--pink-dark); word-break: break-all; }
    .guide-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }
    .guide-box {
      background: #fff8f7;
      padding: 12px;
      border-radius: 13px;
    }
    .guide-box strong { display: block; margin-bottom: 4px; }
    footer {
      position: fixed;
      z-index: 5;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255,250,247,.96);
      border-top: 1px solid var(--line);
      text-align: center;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      color: var(--muted);
      font-size: 11px;
      backdrop-filter: blur(8px);
    }
    @media (max-width: 380px) {
      .tab { padding: 8px 10px; }
      .guide-grid { grid-template-columns: 1fr; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <img class="logo" src="./seoyoon-logo.png" alt="서윤이 로고"
         onerror="this.style.display='none'">
    <div>
      <h1>서윤이의 하루 🌷</h1>
      <div class="subtitle">작은 하루가 모여 큰 성장이 되는 중</div>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="메뉴"></nav>
  <main id="content">
    <div class="empty">서윤이의 하루를 준비하고 있어요 ♡</div>
  </main>
</div>
<footer>서윤이와 함께하는 소중한 기록 ♡</footer>

<script>
"use strict";

const STORAGE_KEY = "choiSeoyoonProfile";
const FEEDING_KEY = "choiSeoyoonFeeding";
const DEFAULT_PROFILE = {
  name: "서윤",
  birth: "2026-01-13"
};
const pageNames = {
  home: "오늘",
  season: "계절",
  dev: "발달",
  play: "놀이",
  feeding: "식이 가이드",
  profile: "우리 아기"
};

let profile = loadProfile();
let feedingRecord = loadFeedingRecord();
let currentPage = "home";
let developmentData = [];
let playData = [];
let weatherData = null;
let weatherMessage = "날씨를 확인하려면 위치 권한을 허용해 주세요.";

function loadProfile() {
  try {
    return { ...DEFAULT_PROFILE,
      ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") };
  } catch {
    return { ...DEFAULT_PROFILE };
  }
}

function loadFeedingRecord() {
  try {
    return JSON.parse(localStorage.getItem(FEEDING_KEY) || "{}");
  } catch {
    return {};
  }
}

function saveProfile() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profile));
}

function saveFeedingRecord() {
  localStorage.setItem(FEEDING_KEY, JSON.stringify(feedingRecord));
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function todayString() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function ageInMonths(birthString) {
  if (!birthString) return null;
  const birth = new Date(birthString + "T12:00:00");
  const today = new Date();
  if (Number.isNaN(birth.getTime()) || birth > today) return null;
  let months = (today.getFullYear() - birth.getFullYear()) * 12
    + today.getMonth() - birth.getMonth();
  if (today.getDate() < birth.getDate()) months--;
  return Math.max(0, months);
}

function ageDescription() {
  const months = ageInMonths(profile.birth);
  if (months === null) return "생년월일을 확인해 주세요.";
  const birth = new Date(profile.birth + "T12:00:00");
  const today = new Date();
  let days = Math.floor((today - birth) / 86400000);
  return `생후 ${months}개월 · ${days}일`;
}

function formatDate(dateString) {
  if (!dateString) return "";
  const d = new Date(dateString + "T12:00:00");
  if (Number.isNaN(d.getTime())) return dateString;
  return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
}

function renderTabs() {
  document.getElementById("tabs").innerHTML =
    Object.entries(pageNames).map(([key, label]) =>
      `<button class="tab ${currentPage === key ? "active" : ""}"
        data-page="${key}">${label}</button>`
    ).join("");
}

function setPage(page) {
  currentPage = page;
  renderTabs();
  renderPage();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function card(title, body, extraClass = "") {
  return `<section class="card ${extraClass}">
    <h2>${title}</h2>${body}</section>`;
}

function renderPage() {
  const content = document.getElementById("content");
  const renderers = {
    home: renderHome,
    season: renderSeason,
    dev: renderDevelopment,
    play: renderPlay,
    feeding: renderFeeding,
    profile: renderProfile
  };
  content.innerHTML = renderers[currentPage]();
}

function renderHome() {
  const name = esc(profile.name);
  const months = ageInMonths(profile.birth);
  const dev = getMonthlyItem(developmentData, months);
  const play = getMonthlyItem(playData, months);

  let weatherHTML = weatherData
    ? `<div class="row">
        <div class="stat"><strong>${esc(weatherData.temp)}°</strong><span class="muted">기온</span></div>
        <div class="stat"><strong>${esc(weatherData.rain)}%</strong><span class="muted">강수확률</span></div>
        <div class="stat"><strong>${esc(weatherData.wind)}</strong><span class="muted">풍속 m/s</span></div>
      </div>
      <p>${esc(weatherData.summary)}</p>
      <p class="muted">${esc(weatherData.clothes)}</p>`
    : `<p class="muted" id="weather-status">${esc(weatherMessage)}</p>
       <button class="btn" id="weather-button">오늘 날씨 확인하기</button>`;

  return `
    <section class="card hero">
      <span class="pill">${formatDate(todayString())}</span>
      <h2>${name}야, 오늘도 반가워! 🌸</h2>
      <p>${esc(ageDescription())}</p>
      <p class="muted">오늘도 서윤이의 속도에 맞춰 천천히 함께해요.</p>
    </section>
    ${card("☀️ 오늘의 날씨", weatherHTML)}
    ${card("🌱 이번 달 발달 정보", dev
      ? `<div class="item-title">${esc(formatMonthTitle(dev))}</div>
         <p>${esc(dev.description || "")}</p>
         <button class="btn secondary" data-goto="dev">발달 정보 더 보기</button>`
      : `<p class="muted">발달 정보를 불러오는 중이에요.</p>`)}
    ${card("🧸 오늘의 놀이 아이디어", play
      ? `<div class="item-title">${esc(formatMonthTitle(play))}</div>
         <p>${esc(play.description || "")}</p>
         <button class="btn secondary" data-goto="play">놀이 더 보기</button>`
      : `<p class="muted">놀이 정보를 불러오는 중이에요.</p>`)}
    ${card("🥣 식이 가이드", `<p>현재 월령에 맞는 식사 진행 방향을 확인해 보세요.</p>
      <button class="btn secondary" data-goto="feeding">식이 가이드 보기</button>`)}
  `;
}

function formatMonthTitle(item) {
  if (!item) return "";
  const month = Number(item.month);
  const title = String(item.title || "");
  if (Number.isFinite(month) && month > 0 && title.includes("·")) {
    return `${month}개월 · ${title.split("·").slice(1).join("·").trim()}`;
  }
  return title;
}

function getMonthlyItem(data, months) {
  if (!Array.isArray(data) || !data.length || months === null) return null;
  return data.find(item => Number(item.month) === months)
    || data.filter(item => Number(item.month) <= months)
      .sort((a,b) => Number(b.month)-Number(a.month))[0]
    || data[0];
}

function renderDevelopment() {
  if (!developmentData.length) {
    return card("🌱 월령별 발달", `<p class="loading">발달 정보를 불러오고 있어요.</p>`);
  }
  const months = ageInMonths(profile.birth);
  const current = getMonthlyItem(developmentData, months);
  return card("🌱 월령별 발달 정보",
    `<p class="muted">현재 ${esc(ageDescription())}</p>
     ${current ? `<div class="item">
       <span class="pill">${esc(current.category || "발달")}</span>
       <h3>${esc(formatMonthTitle(current))}</h3>
       <p>${esc(current.description || "")}</p>
       ${current.sourceUrl ? `<p class="small">출처: <a class="source-link" href="${esc(current.sourceUrl)}" target="_blank" rel="noopener">${esc(current.source || "자료 보기")}</a></p>` : ""}
     </div>` : ""}
     <h3 class="section-title">다른 월령 살펴보기</h3>
     ${developmentData.slice().sort((a,b)=>Number(a.month)-Number(b.month)).map(item =>
       `<div class="item">
         <div class="item-title">${esc(formatMonthTitle(item))}</div>
         <p>${esc(item.description || "")}</p>
         ${item.sourceUrl ? `<p class="small"><a class="source-link" href="${esc(item.sourceUrl)}" target="_blank" rel="noopener">${esc(item.source || "출처")}</a></p>` : ""}
       </div>`
     ).join("")}`
  );
}

function renderPlay() {
  if (!playData.length) {
    return card("🧸 월령별 놀이", `<p class="loading">놀이 정보를 불러오고 있어요.</p>`);
  }
  const months = ageInMonths(profile.birth);
  const current = getMonthlyItem(playData, months);
  return card("🧸 서윤이와 함께하는 놀이",
    `<p class="muted">현재 ${esc(ageDescription())}</p>
     ${current ? `<div class="item">
       <span class="pill">이번 달 추천</span>
       <h3>${esc(formatMonthTitle(current))}</h3>
       <p>${esc(current.description || "")}</p>
     </div>` : ""}
     ${playData.slice().sort((a,b)=>Number(a.month)-Number(b.month)).map(item =>
       `<div class="item">
         <div class="item-title">${esc(formatMonthTitle(item))}</div>
         <p>${esc(item.description || "")}</p>
       </div>`
     ).join("")}
     <div class="notice">놀이 중에는 항상 보호자가 곁에서 지켜봐 주세요. 작은 부품이나 질식 위험이 있는 물건은 피해주세요.</div>`
  );
}

function getSeasonInfo() {
  const month = new Date().getMonth() + 1;
  if ([3,4,5].includes(month)) return {
    name: "봄 🌷",
    clothes: "얇은 옷을 여러 겹 입히고 아침저녁 기온 차에 대비해요.",
    care: "꽃가루와 미세먼지가 심한 날에는 외출 후 손과 얼굴을 씻겨 주세요."
  };
  if ([6,7,8].includes(month)) return {
    name: "여름 ☀️",
    clothes: "통풍이 잘되는 가벼운 옷을 입히고 땀이 차지 않는지 확인해요.",
    care: "더운 시간대의 장시간 외출을 피하고 수분 섭취와 자외선 차단에 신경 써요."
  };
  if ([9,10,11].includes(month)) return {
    name: "가을 🍂",
    clothes: "일교차에 맞춰 겉옷을 준비하고 실내외 온도에 따라 조절해요.",
    care: "건조해지기 쉬우니 피부 보습과 실내 환기를 챙겨 주세요."
  };
  return {
    name: "겨울 ❄️",
    clothes: "실내에서는 너무 두껍게 입히지 말고 외출 시 보온에 신경 써요.",
    care: "난방 중에도 환기와 적절한 실내 습도를 유지하고, 뜨거운 난방기구에 주의해요."
  };
}

function renderSeason() {
  const s = getSeasonInfo();
  return `
    ${card("🍃 지금은 " + s.name, `<p>${esc(s.care)}</p>`)}
    ${card("👕 옷차림 팁", `<p>${esc(s.clothes)}</p>
      <div class="notice">날씨와 아이의 활동량에 따라 옷차림을 조절해 주세요. 손발이 조금 차갑다는 이유만으로 몸 전체가 춥다고 판단하지는 않아도 돼요.</div>`)}
    ${card("🧴 계절별 기본 관리", `
      <div class="item"><strong>피부</strong><p>목욕 후 보습제를 발라 피부가 건조해지지 않도록 해요.</p></div>
      <div class="item"><strong>실내 환경</strong><p>주기적으로 환기하고 실내 온도와 습도를 살펴봐요.</p></div>
      <div class="item"><strong>외출</strong><p>미세먼지·폭염·한파 등 기상 상황을 확인하고 외출 시간을 조절해요.</p></div>
    `)}
  `;
}

/* 식이 가이드는 생후 0~24개월까지만 표시 */
function getFeedingStage(months) {
  if (months <= 5) return {
    title: "수유 중심 시기",
    texture: "모유 또는 영아용 조제분유 중심",
    meals: "아기의 배고픔과 포만감 신호에 맞춰 수유해요.",
    tips: [
      "일반적으로 생후 약 6개월 무렵 이유보충식을 준비해요.",
      "고개 가누기, 도움을 받아 앉기, 음식을 삼키는 능력 등 준비 신호를 살펴요.",
      "생후 12개월 전에는 꿀을 주지 않아요."
    ]
  };
  if (months === 6) return {
    title: "이유식 시작기",
    texture: "부드럽고 삼키기 쉬운 형태부터 시작",
    meals: "소량으로 시작해 아기의 반응에 따라 천천히 늘려요.",
    tips: [
      "철분이 풍부한 고기 등 다양한 식품을 적절한 형태로 제공해요.",
      "새로운 식품은 반응을 살피면서 도입해요.",
      "이유식을 시작해도 모유나 분유 수유를 계속해요."
    ]
  };
  if (months <= 8) return {
    title: "이유식 적응기",
    texture: "으깨거나 부드러운 작은 알갱이가 있는 형태",
    meals: "하루 2회 안팎부터 아이의 섭취와 발달에 맞춰 조절해요.",
    tips: [
      "부드러운 질감에서 점차 다양한 질감으로 진행해요.",
      "철분 식품과 채소, 과일 등 여러 식품군을 경험하게 해요.",
      "먹는 양보다 편안하게 먹고 삼키는 과정도 중요해요."
    ]
  };
  if (months <= 11) return {
    title: "이유식 확장기",
    texture: "잇몸으로 으깰 수 있는 부드러운 덩어리",
    meals: "하루 3회 식사로 점차 정착해 가는 시기예요.",
    tips: [
      "고기·생선·달걀·콩류 등 다양한 단백질과 철분 식품을 제공해요.",
      "손으로 집어 먹을 수 있는 안전한 크기와 질감도 연습해요.",
      "모유나 분유도 계속 제공하며, 섭취량은 개인차를 고려해요."
    ]
  };
  if (months <= 23) return {
    title: "유아식 전환기",

/* 기상청 단기예보 */
const KMA_SERVICE_KEY =
  "f053b7a6559c24052eea0aa2dfa09761052b74ab2ba626d78ebed51de41bf3ea";

function gridFromCoordinates(lat, lon) {
  const RE = 6371.00877;
  const GRID = 5.0;
  const SLAT1 = 30.0 * Math.PI / 180.0;
  const SLAT2 = 60.0 * Math.PI / 180.0;
  const OLON = 126.0 * Math.PI / 180.0;
  const OLAT = 38.0 * Math.PI / 180.0;
  const XO = 43;
  const YO = 136;
  const DEGRAD = Math.PI / 180.0;

  const re = RE / GRID;
  const slat1 = SLAT1;
  const slat2 = SLAT2;
  const olon = OLON;
  const olat = OLAT;

  let sn = Math.tan(Math.PI * 0.25 + slat2 * 0.5) /
           Math.tan(Math.PI * 0.25 + slat1 * 0.5);
  sn = Math.log(Math.cos(slat1) / Math.cos(slat2)) / Math.log(sn);
  let sf = Math.tan(Math.PI * 0.25 + slat1 * 0.5);
  sf = Math.pow(sf, sn) * Math.cos(slat1) / sn;
  let ro = Math.tan(Math.PI * 0.25 + olat * 0.5);
  ro = re * sf / Math.pow(ro, sn);

  let ra = Math.tan(Math.PI * 0.25 + lat * DEGRAD * 0.5);
  ra = re * sf / Math.pow(ra, sn);
  let theta = lon * DEGRAD - olon;
  if (theta > Math.PI) theta -= 2.0 * Math.PI;
  if (theta < -Math.PI) theta += 2.0 * Math.PI;
  theta *= sn;

  return {
    nx: Math.floor(ra * Math.sin(theta) + XO + 0.5),
    ny: Math.floor(ro - ra * Math.cos(theta) + YO + 0.5)
  };
}

function koreaNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Seoul" }));
}

function getBaseTime() {
  const now = koreaNow();
  const candidates = [2300, 2000, 1700, 1400, 1100, 800, 500, 200];
  const current = now.getHours() * 100 + now.getMinutes();
  let base = candidates.find(t => current >= t);
  let date = new Date(now);

  if (base === undefined) {
    date.setDate(date.getDate() - 1);
    base = 2300;
  }
  return {
    date: `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,"0")}${String(date.getDate()).padStart(2,"0")}`,
    time: String(base).padStart(4, "0")
  };
}

async function getWeather() {
  const status = document.getElementById("weather-status");
  const button = document.getElementById("weather-button");
  if (status) status.textContent = "현재 위치와 날씨를 확인하고 있어요.";
  if (button) button.disabled = true;

  if (!("geolocation" in navigator)) {
    weatherMessage = "이 브라우저에서는 위치 확인을 지원하지 않아요.";
    renderPage();
    return;
  }

  navigator.geolocation.getCurrentPosition(async position => {
    try {
      const { nx, ny } = gridFromCoordinates(
        position.coords.latitude, position.coords.longitude
      );
      const base = getBaseTime();
      const url = new URL("https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getVilageFcst");
      url.searchParams.set("serviceKey", KMA_SERVICE_KEY);
      url.searchParams.set("pageNo", "1");
      url.searchParams.set("numOfRows", "1000");
      url.searchParams.set("dataType", "JSON");
      url.searchParams.set("base_date", base.date);
      url.searchParams.set("base_time", base.time);
      url.searchParams.set("nx", nx);
      url.searchParams.set("ny", ny);

      let response = await fetch(url);
      let data = await response.json();
      let items = data?.response?.body?.items?.item || [];

      if (!items.length) {
        throw new Error("예보 자료가 아직 준비되지 않았어요.");
      }

      const now = koreaNow();
      const today = `${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}`;
      const hour = now.getHours();
      const targetTime = `${String(hour).padStart(2,"0")}00`;

      const nearest = category => {
        const list = items.filter(i => i.category === category && i.fcstDate === today);
        if (!list.length) return null;
        list.sort((a,b) => Math.abs(Number(a.fcstTime)-Number(targetTime)) -
                           Math.abs(Number(b.fcstTime)-Number(targetTime)));
        return list[0].fcstValue;
      };

      const temp = nearest("TMP");
      const rain = nearest("POP");
      const wind = nearest("WSD");
      const sky = nearest("SKY");
      const pty = nearest("PTY");

      let summary = "날씨 정보를 확인했어요.";
      if (pty && Number(pty) > 0) {
        summary = Number(pty) === 3 || Number(pty) === 7
          ? "눈이나 진눈깨비 예보가 있어요."
          : "비가 내릴 가능성이 있어요.";
      } else if (sky !== null) {
        summary = Number(sky) <= 5 ? "대체로 맑은 하늘이에요."
          : Number(sky) <= 8 ? "구름이 조금 있을 수 있어요."
          : "흐린 날씨가 예상돼요.";
      }

      let clothes = "외출 전 실제 기온과 바람을 한 번 더 확인해 주세요.";
      if (temp !== null) {
        const t = Number(temp);
        if (t < 5) clothes = "따뜻한 겉옷과 보온에 신경 써 주세요.";
        else if (t < 12) clothes = "겉옷을 준비하고 실내외 온도 차에 대비해요.";
        else if (t < 20) clothes = "얇은 옷을 여러 겹 입혀 조절해 주세요.";
        else if (t < 27) clothes = "통풍이 잘되는 옷을 입히고 활동 중 땀을 확인해요.";
        else clothes = "더운 시간대 외출을 피하고 시원하게 입혀 주세요.";
      }

      weatherData = {
        temp: temp ?? "—",
        rain: rain ?? "—",
        wind: wind ?? "—",
        summary,
        clothes
      };
      weatherMessage = "";
      renderPage();
    } catch (error) {
      weatherMessage = "날씨를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.";
      renderPage();
    }
  }, error => {
    weatherMessage = error.code === 1
      ? "위치 권한이 허용되지 않았어요. 브라우저 설정에서 위치 권한을 허용해 주세요."
      : "현재 위치를 확인하지 못했어요. 다시 시도해 주세요.";
    renderPage();
  }, { enableHighAccuracy: false, timeout: 12000, maximumAge: 600000 });
}

/* 파일에서 월령별 발달·놀이 데이터를 불러와요. */
async function loadData() {
  const [devResult, playResult] = await Promise.allSettled([
    fetch("./development.json").then(r => {
      if (!r.ok) throw new Error("development.json을 불러오지 못했어요.");
      return r.json();
    }),
    fetch("./play.json").then(r => {
      if (!r.ok) throw new Error("play.json을 불러오지 못했어요.");
      return r.json();
    })
  ]);

  if (devResult.status === "fulfilled" && Array.isArray(devResult.value)) {
    developmentData = devResult.value;
  }
  if (playResult.status === "fulfilled" && Array.isArray(playResult.value)) {
    playData = playResult.value;
  }
  renderPage();
}

    renderPage();

});

}
